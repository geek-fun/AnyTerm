[package]
name = "anyterm"
version = "0.0.0"
description = "Lightweight SSH client & terminal for macOS, Windows and Linux. Save hosts and credentials once, then run commands over SSH in multi-tab xterm.js sessions."
authors = ["geekfun"]
license = "Apache-2.0"
repository = "https://github.com/geek-fun/AnyTerm"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = "1"
async-ssh2-tokio = "0.8.9"
log = "0.4.21"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
